<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b5cab">
<title>Pharmapp</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <div class="brand">Pharmapp</div>
  <button id="syncPill" class="pill" type="button">…</button>
</header>
<main id="view"></main>
<nav class="tabs">
  <button data-tab="dia"><span>📅</span>Día</button>
  <button data-tab="viajes"><span>🚗</span>Viajes</button>
  <button data-tab="services"><span>🛠️</span>Services</button>
  <button data-tab="mes"><span>📊</span>Mes</button>
  <button data-tab="mas"><span>⚙️</span>Más</button>
</nav>
<div id="sheet" class="sheet hidden"><div class="sheet-box" id="sheetBox"></div></div>
<div id="toast" class="toast hidden"></div>
<input type="file" id="fileCam" accept="image/*" capture="environment" hidden>
<input type="file" id="fileGal" accept="image/*" multiple hidden>
<input type="file" id="fileJson" accept=".json,application/json" hidden>
<script src="vendor/exceljs.min.js" defer></script>
<script src="vendor/jszip.min.js" defer></script>
<script src="util.js" defer></script>
<script src="db.js" defer></script>
<script src="excel.js" defer></script>
<script src="drive.js" defer></script>
<script src="app.js" defer></script>
</body>
</html>
